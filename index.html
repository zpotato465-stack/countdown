<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Great Meme Reset Countdown</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #title {
      font-size: 48px;
      font-weight: bold;
      text-shadow: 0 0 25px #ff00ff;
      margin-top: 24px;
      position: relative;
      z-index: 10;
    }

    #timer {
      font-size: 56px;
      font-weight: bold;
      text-shadow: 0 0 25px #00eaff;
      margin-bottom: 24px;
      position: relative;
      z-index: 10;
    }

    /* Nyan container */
    .nyan-container {
      position: absolute;
      top: 45%;
      left: -500px;              /* start off-screen */
      width: 600px;              /* container width (controls rainbow length) */
      height: 200px;
      pointer-events: none;
      animation: fly 8s linear infinite;
      z-index: 5;
    }

    /* Rainbow trail */
    .rainbow {
      position: absolute;
      top: 60px;
      left: 0;
      width: 100%;
      height: 30px;
      display: flex;
      filter: blur(0.5px);
    }
    .stripe { flex: 1; height: 100%; }
    .red    { background: #ff4d4d; }
    .orange { background: #ff9a4d; }
    .yellow { background: #ffe14d; }
    .green  { background: #6dff8a; }
    .blue   { background: #6dd0ff; }
    .indigo { background: #9a8cff; }
    .violet { background: #ff80ff; }

    /* Nyan GIF (bigger) */
    .nyan-cat {
      position: absolute;
      right: 10px;             /* Nyan sits at right of container */
      top: 0;
      width: 220px;            /* <-- change this to resize the cat */
      height: auto;
      z-index: 10;
      image-rendering: pixelated; /* keeps retro look for some PNGs/GIFs */
    }

    @keyframes fly {
      0%   { left: -700px; transform: translateY(-6px); }
      25%  { transform: translateY(0px); }
      50%  { transform: translateY(6px); }
      75%  { transform: translateY(0px); }
      100% { left: 110%; transform: translateY(-6px); }
    }

    /* small responsive tweaks */
    @media (max-width: 600px) {
      .nyan-cat { width: 140px; }
      .nyan-container { width: 350px; }
      #timer { font-size: 36px; }
      #title { font-size: 28px; }
    }
  </style>
</head>
<body>

  <div id="title">GREAT MEME RESET IMMINENT IN:</div>
  <div id="timer">loading...</div>

  <!-- Nyan container: GIF + rainbow -->
  <div class="nyan-container" aria-hidden="true">
    <div class="rainbow" aria-hidden="true">
      <div class="stripe red"></div>
      <div class="stripe orange"></div>
      <div class="stripe yellow"></div>
      <div class="stripe green"></div>
      <div class="stripe blue"></div>
      <div class="stripe indigo"></div>
      <div class="stripe violet"></div>
    </div>

    <!-- BIG Nyan GIF from a reliable host -->
    <img class="nyan-cat"
         src="https://media.giphy.com/media/sIIhZliB2McAo/giphy.gif"
         alt="Nyan Cat">
  </div>

  <!-- Background music file (looping). Put background.mp3 in same folder -->
  <audio id="backgroundMusic" loop>
    <source src="background.mp3" type="audio/mpeg">
  </audio>

  <!-- alert.mp3 will be played programmatically at 1:50 remaining -->
  <script>
    // TARGET DATE (UTC local) — change if you want a specific timezone
    const resetDate = new Date("January 1, 2026 00:00:00").getTime();

    // Flags
    let specialSoundPlayed = false;

    // Try autoplay background music. Many browsers block autoplay until user interacts.
    const bg = document.getElementById('backgroundMusic');
    // Attempt to start; if blocked user can click anywhere to allow (see note below)
    bg.volume = 0.6;
    const tryPlayBackground = async () => {
      try {
        await bg.play();
      } catch (e) {
        // Autoplay blocked — will play on first user interaction
        document.addEventListener('click', () => bg.play(), { once: true });
      }
    };
    tryPlayBackground();

    // Countdown updater (runs every 250ms for better timing)
    const update = () => {
      const now = Date.now();
      const diff = resetDate - now;

      if (diff <= 0) {
        document.getElementById('timer').textContent = "INITIATING...";
        return;
      }

      const days    = Math.floor(diff/(1000*60*60*24));
      const hours   = Math.floor((diff % (1000*60*60*24))/(1000*60*60));
      const minutes = Math.floor((diff % (1000*60*60))/(1000*60));
      const seconds = Math.floor((diff % (1000*60))/1000);

      document.getElementById('timer').textContent =
        `${days}D ${hours}H ${minutes}M ${seconds}S`;

      // Play alert.mp3 when EXACTLY 1:50 remains (one-time)
      if (!specialSoundPlayed && minutes === 1 && seconds === 50) {
        // alert.mp3 must be in same folder as index.html on GitHub
        const alertSound = new Audio('alert.mp3');
        alertSound.volume = 1.0;
        alertSound.play().catch(() => {
          // autoplay blocked: wait for user click
          document.addEventListener('click', () => alertSound.play(), { once: true });
        });
        specialSoundPlayed = true;
      }
    };

    // Start timer
    update();
    setInterval(update, 250);
  </script>

  <!-- Small note for users who can't hear audio immediately -->
  <div style="position:fixed;bottom:8px;right:8px;color:#ccc;font-size:12px;">
    If you don't hear music, click the page once to enable audio.
  </div>
</body>
</html>
